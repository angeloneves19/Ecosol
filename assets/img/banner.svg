<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Trama Viamao - economia solidaria perto de voce">
<defs>
  <clipPath id="moldura"><rect width="1200" height="300" rx="18"/></clipPath>
  <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2B3886"/>
    <stop offset="1" stop-color="#1C245C"/>
  </linearGradient>
</defs>

<style>
  .fio { stroke: #F4B63F; stroke-width: 2; opacity: .18; animation: pulsar 4.2s ease-in-out infinite; }
  .passada { stroke: #FFFFFF; stroke-width: 3; stroke-dasharray: 13 13; opacity: .14; animation: correr 9s linear infinite; }
  .lancadeira { animation: atravessar 4.8s cubic-bezier(.45,0,.55,1) infinite; }
  .titulo { font: 700 68px 'Trebuchet MS', Verdana, sans-serif; fill: #FFFFFF; letter-spacing: -1.5px; }
  .sub { font: 400 23px 'Trebuchet MS', Verdana, sans-serif; fill: #E4E7F7; }
  .tecido rect { animation: subir 1.1s ease-out both; }

  @keyframes pulsar { 0%, 100% { opacity: .12 } 50% { opacity: .4 } }
  @keyframes correr { to { stroke-dashoffset: -260 } }
  @keyframes atravessar { 0% { transform: translateX(-60px) } 50% { transform: translateX(1210px) } 100% { transform: translateX(-60px) } }
  @keyframes subir { from { transform: translateY(14px); opacity: 0 } }

  @media (prefers-reduced-motion: reduce) {
    .fio, .passada, .lancadeira, .tecido rect { animation: none }
  }
</style>

<g clip-path="url(#moldura)">
