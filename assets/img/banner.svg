  <text class="titulo" x="60" y="150">Trama Viamão</text>
  <text class="sub" x="64" y="194">Quem produz aqui, encontrado por quem mora aqui.</text>

  <g class="tecido">
    <rect x="0" y="282" width="300" height="18" fill="#F4B63F"/>
    <rect x="300" y="282" width="300" height="18" fill="#2E7D5B" style="animation-delay:.12s"/>
    <rect x="600" y="282" width="300" height="18" fill="#E4E7F7" style="animation-delay:.24s"/>
